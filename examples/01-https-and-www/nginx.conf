# ---------- Redirect HTTP to HTTPS + canonical host, in one hop ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

# ---------- Redirect www.example.com to example.com (visitors who land on https://www.example.com directly) ----------
server {
    listen 443 ssl http2;   # nginx 1.25.1+: use "listen 443 ssl;" plus "http2 on;"
    listen [::]:443 ssl http2;
    server_name www.example.com;
    # REQUIRED -- nginx will not start without a certificate here:
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;
    return 301 https://example.com$request_uri;
}

