# ---------- Add ONCE inside the http {} block of nginx.conf (not inside a server {} block) ----------
map $http_user_agent $hrg_blocked_ua {
    default 0;
    "~*(GPTBot|ClaudeBot|anthropic-ai|CCBot|Bytespider|meta-externalagent|FacebookBot|Amazonbot|cohere-training-data-crawler|Diffbot|AI2Bot|omgili|DeepSeekBot|PanguBot|ImagesiftBot|img2dataset|MistralAI-Training)" 1;   # AI training crawlers
    "~*(OAI-SearchBot|Claude-SearchBot|PerplexityBot|DuckAssistBot|MistralAI-Index|meta-webindexer|Amzn-SearchBot|cohere-ai|Kimi-SearchBot|ChatGPT-User|Claude-User|Perplexity-User|MistralAI-User|meta-externalfetcher|Amzn-User)" 1;   # AI search & assistant fetchers
    "~*(AhrefsBot|SemrushBot|MJ12bot|DotBot|BLEXBot|PetalBot|DataForSeoBot|SeekportBot|serpstatbot|MauiBot)" 1;
    "~*(nikto|sqlmap|nmap|masscan|zgrab)" 1;   # vulnerability scanners
    "~*(libwww-perl|python-requests|Go-http-client)" 1;   # scripting libraries
    "" 1;   # empty User-Agent
}

# ---------- Add inside your MAIN server {} block (the one serving example.com) ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    # ... your existing root, index and ssl_certificate lines ...
    # Keep your existing PHP block (location ~ \.php$) BELOW the deny rules further down,
    # otherwise the uploads-folder PHP block will not work.

    if ($hrg_blocked_ua) { return 403; }
}

