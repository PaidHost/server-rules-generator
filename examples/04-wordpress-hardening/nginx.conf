# ---------- Add ONCE inside the http {} block of nginx.conf (not inside a server {} block) ----------
map $request_uri $hrg_author_scan {
    default 0;
    "~^/(?!wp-admin)[^?]*\?(.*&)?author=[0-9]" 1;
}

# ---------- Add inside your MAIN server {} block (the one serving example.com) ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    # ... your existing root, index and ssl_certificate lines ...
    # Keep your existing PHP block (location ~ \.php$) BELOW the deny rules further down,
    # otherwise the uploads-folder PHP block will not work.

    if ($hrg_author_scan) { return 403; }   # ?author=N username scans
    autoindex off;   # directory listing (off by default; stated explicitly)

    # ---- Deny rules: keep these ABOVE your "location ~ \.php$" block ----
    location ~ /\.(?!well-known/) { deny all; }   # .env, .git, .htpasswd ...
    location ~* (?:\.(?:bak|conf|config|dist|inc|ini|log|orig|psd|save|sh|sql|swo|swp)|~)$ { deny all; }
    location ~* /(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock)$ { deny all; }
    location = /xmlrpc.php { deny all; }   # breaks Jetpack / XML-RPC apps
    location = /wp-config.php { deny all; }
    location ~* ^/wp-content/uploads/.*\.(?:php\d?|phtml|phar)$ { deny all; }
}

