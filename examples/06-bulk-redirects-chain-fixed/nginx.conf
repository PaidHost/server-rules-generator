# ---------- Add ONCE inside the http {} block of nginx.conf (not inside a server {} block) ----------
# Bulk 301 redirects (4) : one hop to the final URL
map $uri $hrg_redirect_to {
    default "";
    "/old-page" "https://example.com/new-page";
    "/old-page/" "https://example.com/new-page";
    "/2019/sale" "https://example.com/offers";
    "/2019/sale/" "https://example.com/offers";
    "/sale" "https://example.com/offers";
    "/sale/" "https://example.com/offers";
    "/about-us.html" "https://example.com/about";
    "/about-us.html/" "https://example.com/about";
}

# ---------- Redirect HTTP to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    if ($hrg_redirect_to) { return 301 $hrg_redirect_to$is_args$args; }   # keeps the visitor's query string
    return 301 https://$host$request_uri;
}

# ---------- Add inside your MAIN server {} block (the one serving example.com on 443) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;
    # ... your existing root, index and ssl_certificate lines ...
    # Keep your existing PHP block (location ~ \.php$) BELOW the deny rules further down,
    # otherwise the uploads-folder PHP block will not work.

    if ($hrg_redirect_to) { return 301 $hrg_redirect_to$is_args$args; }   # keeps the visitor's query string
}

