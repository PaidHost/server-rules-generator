# ---------- Redirect HTTP to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

# ---------- Add inside your MAIN server {} block (the one serving example.com on 443) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;
    # ... your existing root, index and ssl_certificate lines ...
    # Keep your existing PHP block (location ~ \.php$) BELOW the deny rules further down,
    # otherwise the uploads-folder PHP block will not work.

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

